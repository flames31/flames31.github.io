<script>
  /* Apply the theme before first paint — prevents a flash of the wrong one.
     A stored choice wins; otherwise follow the OS, defaulting to dark. */
  try {
    var s = localStorage.getItem('scheme');
    var dark = s ? s === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.classList.toggle('dark', dark);
  } catch (e) { document.documentElement.classList.add('dark'); }
</script>
